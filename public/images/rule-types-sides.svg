<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="Equilateral, isosceles and scalene triangles" font-family="Segoe UI, Arial, sans-serif" font-weight="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <polygon points="20,150 120,150 70,63.4" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <line x1="51.1" y1="110.2" x2="38.9" y2="103.2" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="101.1" y1="103.2" x2="88.9" y2="110.2" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="143" x2="70" y2="157" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="182" fill="#1e3a8a" font-size="15" text-anchor="middle">Equilateral</text>
  <text x="70" y="200" fill="#64748b" font-size="12" text-anchor="middle">3 equal sides</text>

  <polygon points="150,150 250,150 200,40" fill="#dcfce7" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <line x1="181.4" y1="97.9" x2="168.6" y2="92.1" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="231.4" y1="92.1" x2="218.6" y2="97.9" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="182" fill="#1e3a8a" font-size="15" text-anchor="middle">Isosceles</text>
  <text x="200" y="200" fill="#64748b" font-size="12" text-anchor="middle">2 equal sides</text>

  <polygon points="275,150 385,150 340,70" fill="#fef3c7"/>
  <line x1="275" y1="150" x2="385" y2="150" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <line x1="275" y1="150" x2="340" y2="70" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="385" y1="150" x2="340" y2="70" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="182" fill="#1e3a8a" font-size="15" text-anchor="middle">Scalene</text>
  <text x="330" y="200" fill="#64748b" font-size="12" text-anchor="middle">all sides different</text>
</svg>
