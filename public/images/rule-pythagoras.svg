<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Pythagoras: squares on the two short sides add up to the square on the long side" font-family="Segoe UI, Arial, sans-serif" font-weight="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="75" y="125" width="75" height="75" fill="#f59e0b" fill-opacity=".4" stroke="#d97706" stroke-width="3"/>
  <rect x="150" y="200" width="100" height="100" fill="#0ea5e9" fill-opacity=".35" stroke="#0284c7" stroke-width="3"/>
  <polygon points="250,200 150,125 225,25 325,100" fill="#ef4444" fill-opacity=".3" stroke="#dc2626" stroke-width="3"/>
  <polygon points="150,200 250,200 150,125" fill="#ffffff" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M162 200 V188 H150" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <text x="112" y="168" fill="#92400e" font-size="16" text-anchor="middle">3² = 9</text>
  <text x="200" y="256" fill="#075985" font-size="18" text-anchor="middle">4² = 16</text>
  <text x="237.5" y="118" fill="#991b1b" font-size="18" text-anchor="middle" transform="rotate(36.9 237.5 112.5)">5² = 25</text>
  <text x="20" y="32" fill="#1e3a8a" font-size="24">a² + b² = c²</text>
  <text x="20" y="50" fill="#64748b" font-size="12">(right-angled triangles only)</text>
  <text x="328" y="238" fill="#1e3a8a" font-size="15" text-anchor="middle">3² + 4² = 5²</text>
  <text x="328" y="262" fill="#1e3a8a" font-size="20" text-anchor="middle">9 + 16 = 25</text>
</svg>
