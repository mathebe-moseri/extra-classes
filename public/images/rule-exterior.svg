<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="An exterior angle equals the sum of the two inside angles it is not next to" font-family="Segoe UI, Arial, sans-serif" font-weight="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <line x1="260" y1="200" x2="368" y2="200" stroke="#1e3a8a" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>
  <polygon points="90,200 260,200 190,60" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M90 200 L124 200 A34 34 0 0 0 109.8 172.3 Z" fill="#f59e0b" fill-opacity=".45" stroke="#f59e0b" stroke-width="2"/>
  <path d="M190 60 L172.6 84.4 A30 30 0 0 0 203.4 86.8 Z" fill="#10b981" fill-opacity=".45" stroke="#10b981" stroke-width="2"/>
  <path d="M260 200 L296 200 A36 36 0 0 0 243.9 167.8 Z" fill="#ef4444" fill-opacity=".35" stroke="#ef4444" stroke-width="2"/>
  <text x="138" y="183" fill="#b45309" font-size="20" text-anchor="middle">a</text>
  <text x="192" y="126" fill="#047857" font-size="20" text-anchor="middle">c</text>
  <text x="292" y="172" fill="#b91c1c" font-size="22">a + c</text>
  <text x="74" y="218" fill="#64748b" font-size="14">A</text>
  <text x="256" y="222" fill="#64748b" font-size="14">B</text>
  <text x="190" y="48" fill="#64748b" font-size="14" text-anchor="middle">C</text>
  <text x="200" y="240" fill="#1e3a8a" font-size="17" text-anchor="middle">Outside angle = a + c</text>
  <text x="200" y="256" fill="#64748b" font-size="12" text-anchor="middle">(the two inside angles it is NOT next to)</text>
</svg>
