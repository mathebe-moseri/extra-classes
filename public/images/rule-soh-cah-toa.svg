<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="SOH CAH TOA: sine, cosine and tangent ratios in a right-angled triangle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <polygon points="60,200 260,200 60,90" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M72 200 V188 H60" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <path d="M260 200 L225 200 A35 35 0 0 1 229.3 183.2 Z" fill="#ef4444" fill-opacity=".45" stroke="#ef4444" stroke-width="2"/>
  <text x="206" y="194" fill="#b91c1c" font-size="20" text-anchor="middle">θ</text>
  <text x="50" y="150" fill="#047857" font-size="14" text-anchor="end">Opposite</text>
  <text x="160" y="224" fill="#b45309" font-size="14" text-anchor="middle">Adjacent</text>
  <text x="166.7" y="132.7" fill="#1e3a8a" font-size="14" text-anchor="middle" transform="rotate(28.8 166.7 132.7)">Hypotenuse</text>
  <text x="275" y="100" fill="#64748b" font-size="12">Stand at θ and look:</text>
  <text x="275" y="120" fill="#047857" font-size="12">O = across from θ</text>
  <text x="275" y="138" fill="#b45309" font-size="12">A = beside θ</text>
  <text x="275" y="156" fill="#1e3a8a" font-size="12">H = the slanted one</text>
  <rect x="30" y="240" width="340" height="22" rx="11" fill="#e0f2fe"/>
  <text x="200" y="256" fill="#075985" font-size="14" text-anchor="middle">SOH: sin θ = Opposite ÷ Hypotenuse</text>
  <rect x="30" y="266" width="340" height="22" rx="11" fill="#d1fae5"/>
  <text x="200" y="282" fill="#065f46" font-size="14" text-anchor="middle">CAH: cos θ = Adjacent ÷ Hypotenuse</text>
  <rect x="30" y="292" width="340" height="22" rx="11" fill="#fef3c7"/>
  <text x="200" y="308" fill="#92400e" font-size="14" text-anchor="middle">TOA: tan θ = Opposite ÷ Adjacent</text>
</svg>
