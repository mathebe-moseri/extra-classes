<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="Right-angled triangle with one 90 degree angle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Right-angled</title>
  <polygon points="100,70 100,243 300,243" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M122 243 V221 H100" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <text x="143" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#ef4444">90°</text>
  <text transform="rotate(41 214 142)" x="214" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#64748b">hypotenuse</text>

  <text x="200" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#1e3a8a">Right-angled</text>
  <text x="200" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#64748b">one angle = 90°</text>
</svg>
