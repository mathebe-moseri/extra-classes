<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="Acute, right and obtuse triangles" font-family="Segoe UI, Arial, sans-serif" font-weight="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <polygon points="20,150 125,150 72,62" fill="#dcfce7" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <text x="72" y="182" fill="#1e3a8a" font-size="15" text-anchor="middle">Acute</text>
  <text x="72" y="200" fill="#64748b" font-size="12" text-anchor="middle">all angles under 90°</text>

  <polygon points="150,150 245,150 150,72" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M162 150 V138 H150" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="197" y="182" fill="#1e3a8a" font-size="15" text-anchor="middle">Right</text>
  <text x="197" y="200" fill="#64748b" font-size="12" text-anchor="middle">one angle = 90°</text>

  <polygon points="290,150 385,150 250,80" fill="#fef3c7" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M290 150 L310 150 A20 20 0 0 0 280.1 132.6 Z" fill="#ef4444" fill-opacity=".45" stroke="#ef4444" stroke-width="2"/>
  <text x="330" y="182" fill="#1e3a8a" font-size="15" text-anchor="middle">Obtuse</text>
  <text x="330" y="200" fill="#64748b" font-size="12" text-anchor="middle">one angle over 90°</text>
</svg>
