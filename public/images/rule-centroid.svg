<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="The three medians meet at the centroid, which splits each median in the ratio 2 to 1" font-family="Segoe UI, Arial, sans-serif" font-weight="700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <polygon points="200,40 80,210 320,210" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/>
  <line x1="200" y1="40" x2="200" y2="210" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="210" x2="260" y2="125" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="210" x2="140" y2="125" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="210" r="5" fill="#1e3a8a"/>
  <circle cx="260" cy="125" r="5" fill="#1e3a8a"/>
  <circle cx="140" cy="125" r="5" fill="#1e3a8a"/>
  <circle cx="200" cy="153.3" r="8" fill="#1e3a8a" stroke="#ffffff" stroke-width="2"/>
  <text x="214" y="98" fill="#991b1b" font-size="15">2 parts</text>
  <text x="214" y="192" fill="#991b1b" font-size="15">1 part</text>
  <text x="182" y="180" fill="#1e3a8a" font-size="16" text-anchor="middle">G</text>
  <text x="200" y="232" fill="#64748b" font-size="12" text-anchor="middle">A median joins a corner to the middle of the opposite side</text>
  <text x="200" y="252" fill="#1e3a8a" font-size="16" text-anchor="middle">G = centroid, it splits every median 2 : 1</text>
</svg>
