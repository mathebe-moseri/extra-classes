<ng-container>
  <!-- Nav stays outside blur -->
  <app-nav #nav />

  <!-- Page content that should blur -->
  <div [class.blur-background]="nav.isMobileMenuOpen || nav.isContactFormOpen || hero.showQuiz">
    <app-hero #hero />
    <!-- Other page content -->
  </div>

  <!-- Join Our Classes Popup -->
  <div *ngIf="nav.isMobileMenuOpen" class="fixed inset-0 flex items-center justify-center z-50">
    <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="nav.closeForm()"></div>

    <div class="form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm p-6 relative"
         (click)="$event.stopPropagation()">
      <button (click)="nav.closeForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
      <h3 class="text-center font-bold text-lg mb-4">Join Our Classes</h3>
      <form (ngSubmit)="nav.submitForm()" class="flex flex-col gap-3">
        <input name="learnerFirstName" [(ngModel)]="nav.learnerFirstName" required placeholder="First Name" class="px-3 py-2 rounded border border-gray-300">
        <input name="learnerSurname" [(ngModel)]="nav.learnerSurname" required placeholder="Surname" class="px-3 py-2 rounded border border-gray-300">
        <input name="grade" [(ngModel)]="nav.grade" required placeholder="Grade" class="px-3 py-2 rounded border border-gray-300">
        <input name="email" [(ngModel)]="nav.email" required placeholder="Email" class="px-3 py-2 rounded border border-gray-300">
        <input name="schoolName" [(ngModel)]="nav.schoolName" required placeholder="School Name" class="px-3 py-2 rounded border border-gray-300">
        <input name="parentFullName" [(ngModel)]="nav.parentFullName" required placeholder="Parent/Guardian Name" class="px-3 py-2 rounded border border-gray-300">
        <input name="parentCell" [(ngModel)]="nav.parentCell" required placeholder="Parent/Guardian Cell" class="px-3 py-2 rounded border border-gray-300">
        <button type="submit" class="mt-2 w-full bg-gray-800 text-white rounded py-2">JOIN</button>
      </form>
    </div>
  </div>

  <!-- ContactUS Popup -->
  <div *ngIf="nav.isContactFormOpen" class="fixed inset-0 flex items-center justify-center z-50">
    <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="nav.closeContactForm()"></div>
    <div class="contact-form-popup form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm p-6 relative"
         (click)="$event.stopPropagation()">
      <button (click)="nav.closeContactForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
      <h3 class="text-center font-bold text-lg mb-4">Contact Us</h3>

      <div class="flex justify-center gap-4 mb-4">
        <button (click)="nav.contactFormType='whatsapp'"
                [ngClass]="nav.contactFormType==='whatsapp' ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-800'"
                class="px-3 py-1 rounded font-bold">WhatsApp</button>
        <button (click)="nav.contactFormType='email'"
                [ngClass]="nav.contactFormType==='email' ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-800'"
                class="px-3 py-1 rounded font-bold">Email</button>
      </div>

      <form *ngIf="nav.contactFormType==='whatsapp'" (ngSubmit)="nav.sendWhatsappMessage()" class="flex flex-col gap-3">
        <input name="whatsappNumber" [(ngModel)]="nav.whatsappNumber" required placeholder="WhatsApp Number" class="px-3 py-2 rounded border border-gray-300">
        <textarea name="whatsappMessage" [(ngModel)]="nav.whatsappMessage" required placeholder="Message" class="px-3 py-2 rounded border border-gray-300"></textarea>
        <button type="submit" class="mt-2 w-full bg-green-500 text-white rounded py-2">Send via WhatsApp</button>
      </form>

      <form *ngIf="nav.contactFormType==='email'" (ngSubmit)="nav.sendEmailMessage()" class="flex flex-col gap-3">
        <input name="emailAddress" [(ngModel)]="nav.emailAddress" required placeholder="Your Email" class="px-3 py-2 rounded border border-gray-300">
        <textarea name="emailMessage" [(ngModel)]="nav.emailMessage" required placeholder="Message" class="px-3 py-2 rounded border border-gray-300"></textarea>
        <button type="submit" class="mt-2 w-full bg-green-500 text-white rounded py-2">Send via Email</button>
      </form>
    </div>
  </div>

  <!-- Test Your Knowledge Popup -->
  <div *ngIf="hero.showQuiz" class="fixed inset-0 flex items-center justify-center z-50">
    <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="hero.closeQuiz()"></div>
    <div class="relative bg-white-50 text-gray-800 rounded-xl p-8 w-full max-w-sm shadow-2xl z-10 m-5" (click)="$event.stopPropagation()">
      <h3 class="text-2xl font-bold mb-4 text-center">Trig Quiz</h3>
      <p class="mb-4 text-center">
        In a right-angled triangle, if angle θ is {{hero.quizAngle}}° and the hypotenuse is {{hero.quizHypotenuse}} units, what is the length of the side opposite to θ?
      </p>
      <input [(ngModel)]="hero.userAnswer" type="number" placeholder="Enter your answer" class="w-full px-3 py-2 rounded border border-gray-600 mb-4 text-gray-900">
      <div class="flex justify-between">
        <button (click)="hero.checkAnswer()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Submit</button>
        <button (click)="hero.closeQuiz()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Close</button>
      </div>
      <p *ngIf="hero.feedback" class="mt-4 text-center font-semibold" [ngClass]="{'text-green-500': hero.isCorrect,'text-red-500': !hero.isCorrect}">{{hero.feedback}}</p>
    </div>
  </div>
</ng-container>
