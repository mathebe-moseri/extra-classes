<header class="w-full bg-gray-300 py-2 fixed top-0 z-50 shadow-md px-4 md:px-6 lg:px-8">
  <div class="flex items-center justify-between">

    <!-- Brand -->
    <a href="#hero"
       class="font-semibold text-gray-800 text-[12px] md:text-[14px] lg:text-[16px]">
      <span class="block text-[8px] md:text-[10px] lg:text-[12px] px-9">Sesi Mathebe</span>
      <span>Remote Extra Classes</span>
    </a>

    <!-- DESKTOP BUTTONS -->
    <div class="hidden md:flex items-center gap-3">

      <!-- Info -->
      <button (click)="scrollToAbout()"
        class="bg-white-50 hover:bg-blue-600 text-gray-600 px-4 rounded-full font-bold transition">
        info !!
      </button>

      <!-- Join -->
      <button (click)="toggleMobileMenu()"
        class="w-28 bg-gray-600 border border-gray-700 rounded-full py-2 text-white font-bold shadow-lg">
        Join Our Classes
      </button>

    </div>

    <!-- MOBILE MENU BUTTON -->
    <button (click)="toggleNavMenu()"
      class="md:hidden text-2xl font-bold text-gray-800">
      ☰
    </button>

  </div>
</header>

<!-- MOBILE MENU -->
<div *ngIf="isNavMenuOpen"
     class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm"
     (click)="closeNavMenu()"> <!-- <-- clicking the overlay closes menu -->

  <div class="absolute top-16 right-2 bg-white-50 rounded-xl shadow-xl w-60 p-4 space-y-2"
       (click)="$event.stopPropagation()"> <!-- <-- clicking inside does NOT close -->

    <!-- Buttons -->
<button
  (click)="selectMenu('about'); scrollToAbout()"
  [ngClass]="selectedMenu === 'about' ? 'bg-green-300' : 'bg-blue-400'"
  class="w-full text-left px-4 py-2 rounded-2xl font-bold text-gray-600 transition">
  What We Offer
</button>

    <button
      (click)="selectMenu('apply')"
      [ngClass]="selectedMenu === 'apply' ? 'bg-green-300' : 'bg-white-50'"
      class="w-full text-left px-4 py-2 rounded-2xl font-bold text-gray-600 bg-blue-400 transition">
      How To Apply
    </button>

    <button
      (click)="selectMenu('join'); toggleMobileMenu()"
      [ngClass]="selectedMenu === 'join' ? 'bg-green-300' : 'bg-white-50'"
      class="w-full text-left px-4 py-2 rounded-2xl font-bold text-gray-600 bg-blue-400 transition">
      Join Our Classes
    </button>

    <button
      (click)="selectMenu('contact'); openContactForm()"
      [ngClass]="selectedMenu === 'contact' ? 'bg-green-300' : 'bg-white-50'"
      class="w-full text-left px-4 py-2 rounded-2xl font-bold text-gray-600 bg-blue-400 transition">
      Contact Us
    </button>

  </div>
</div>


<!-- Join Form Popup -->
<div *ngIf="isMobileMenuOpen" class="fixed inset-0 flex items-center justify-center popup px-3 md:px-6 lg:px-8">
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="closeForm()"></div>

  <div class="form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm md:max-w-md lg:max-w-lg 
              p-4 md:p-6 lg:p-8 relative"
       (click)="$event.stopPropagation()">
    <button (click)="closeForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
    <h3 class="text-center font-bold text-lg mb-4">Join Our Classes</h3>

    <form (ngSubmit)="submitForm()" class="flex flex-col gap-3">
      <input name="learnerFirstName" [(ngModel)]="learnerFirstName" required type="text" placeholder="Learner First Name"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="learnerSurname" [(ngModel)]="learnerSurname" required type="text" placeholder="Learner Surname"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="grade" [(ngModel)]="grade" required type="text" placeholder="Grade"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="email" [(ngModel)]="email" required type="email" placeholder="Email"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="schoolName" [(ngModel)]="schoolName" required type="text" placeholder="School Name"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="parentFullName" [(ngModel)]="parentFullName" required type="text" placeholder="Parent/Guardian Full Name"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="parentCell" [(ngModel)]="parentCell" required type="text" placeholder="Parent/Guardian Cell"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <button type="submit"
              [disabled]="!learnerFirstName || !learnerSurname || !grade || !email || !schoolName || !parentFullName || !parentCell"
              class="mt-2 w-full bg-gray-800 hover:bg-gray-700 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white-50">
        JOIN
      </button>
    </form>
  </div>
</div>

<!-- Contact Form Popup -->
<div *ngIf="isContactFormOpen" class="fixed inset-0 flex items-center justify-center popup px-3 md:px-6 lg:px-8">
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="closeContactForm()"></div>

  <div class="contact-form-popup form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm md:max-w-md lg:max-w-lg 
              p-4 md:p-6 lg:p-8 relative"
       (click)="$event.stopPropagation()">
    <button (click)="closeContactForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
    <h3 class="text-center font-bold text-lg mb-4">Contact Us</h3>

    <div class="flex justify-center gap-4 mb-4">
      <button (click)="contactFormType='whatsapp'"
              [ngClass]="contactFormType==='whatsapp' ? 'bg-green-500 text-white' : 'bg-gray-600 text-gray-800'"
              class="px-3 py-1 md:py-2 rounded font-bold">WhatsApp</button>
      <button (click)="contactFormType='email'"
              [ngClass]="contactFormType==='email' ? 'bg-green-500 text-white' : 'bg-gray-600 text-gray-800'"
              class="px-3 py-1 md:py-2 rounded font-bold">Email</button>
    </div>

    <!-- WhatsApp Form -->
    <form *ngIf="contactFormType==='whatsapp'" (ngSubmit)="sendWhatsappMessage()" class="flex flex-col gap-3">
      <input name="whatsappNumber" [(ngModel)]="whatsappNumber" required type="text" placeholder="Your WhatsApp Number"
             class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <textarea name="whatsappMessage" [(ngModel)]="whatsappMessage" required placeholder="Your Message"
                class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50"></textarea>
      <button type="submit" [disabled]="!whatsappNumber || !whatsappMessage"
              class="mt-2 w-full bg-green-500 hover:bg-green-600 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white">
        Send via WhatsApp
      </button>
    </form>

    <!-- Email Form -->
    <form *ngIf="contactFormType==='email'" (ngSubmit)="sendEmailMessage()" class="flex flex-col gap-3">
      <textarea name="emailMessage" [(ngModel)]="emailMessage" required placeholder="Your Message"
                class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50"></textarea>
      <button type="submit" [disabled]="!emailMessage"
              class="mt-2 w-full bg-green-500 hover:bg-blue-600 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white">
        Send via Email
      </button>
    </form>
  </div>
</div>
