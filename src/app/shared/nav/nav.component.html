<!-- ============ HEADER ============ -->
<header class="w-full fixed top-0 left-0 right-0 z-[99999] shadow-md px-4 md:px-6 lg:px-8 h-14 bg-white">
  <div class="flex items-center justify-between h-full">

    <button type="button" (click)="scrollToHero()" class="text-left font-semibold text-gray-900 text-[12px] md:text-[14px] lg:text-[16px]">
      <span class="block italic font-serif font-medium text-[6px] md:text-[10px] lg:text-[12px]">Sesi Mathebe</span>
      <span>Remote Extra Classes</span>
    </button>

    <!-- Desktop navigation -->
    <nav class="hidden md:flex items-center gap-1" aria-label="Main">
      <button *ngFor="let s of sections" type="button" (click)="goTo(s.id)"
        class="px-3 py-2 rounded-full text-sm font-semibold transition-colors"
        [ngClass]="activeSection === s.id ? 'bg-sky-100 text-[#1e3a8a]' : 'text-gray-600 hover:text-gray-900'">
        {{ s.label }}
      </button>
      <button type="button" (click)="toggleMobileMenu()" class="btn btn-navy ml-3 !min-h-10 px-5 text-sm">Sign up</button>
      <button type="button" (click)="openLoginForm()" class="btn btn-outline ml-2 !min-h-10 px-5 text-sm">Log in</button>
    </nav>

    <!-- Mobile menu button -->
    <button type="button" (click)="toggleNavMenu()" [attr.aria-expanded]="isNavMenuOpen" aria-label="Menu"
      class="md:hidden text-2xl font-bold text-gray-800 w-11 h-11 text-center">
      {{ isNavMenuOpen ? '✕' : '☰' }}
    </button>
  </div>
</header>

<!-- Reading progress -->
<div class="progress" [style.transform]="'scaleX(' + progress + ')'" aria-hidden="true"></div>

<!-- ============ MOBILE MENU ============ -->
<div *ngIf="isNavMenuOpen" class="modal-layer menu-panel md:hidden !z-[99990] !items-stretch bg-[#1e3a8a]"
  style="top: 3.5rem;">
  <div class="flex flex-col w-full min-h-full px-5 pt-3 pb-6 overflow-y-auto">

    <nav class="text-white">
      <button *ngFor="let s of sections" type="button" (click)="goTo(s.id)" class="menu-item"
        [attr.aria-current]="activeSection === s.id ? 'true' : null">
        <span>{{ s.label }}</span><span class="text-blue-200">›</span>
      </button>

      <button type="button" (click)="openTestimonialsFromMenu()" class="menu-item">
        <span>Testimonials</span><span class="text-blue-200">▶</span>
      </button>

      <button type="button" (click)="isContactMenuOpen = !isContactMenuOpen" class="menu-item !border-b-0"
        [attr.aria-expanded]="isContactMenuOpen">
        <span>Contact us</span>
        <span class="text-blue-200 text-sm transition-transform duration-200" [class.rotate-180]="isContactMenuOpen">⌄</span>
      </button>

      <div *ngIf="isContactMenuOpen" class="flex gap-3 pb-4">
        <button type="button" (click)="openContactFrom('whatsapp')" class="btn flex-1 bg-white/15 text-white">💬 WhatsApp</button>
        <button type="button" (click)="openContactFrom('email')" class="btn flex-1 bg-white/15 text-white">✉️ Email</button>
      </div>
    </nav>

    <div class="mt-auto pt-6 border-t border-white/15">
      <button type="button" (click)="closeNavMenu(); toggleMobileMenu()" class="btn btn-primary w-full">Sign up</button>
      <button type="button" (click)="closeNavMenu(); openLoginForm()" class="btn btn-light w-full mt-3">Log in</button>
      <p class="text-blue-100 text-xs text-center mt-4">CAPS-aligned · Grades 10, 11 and 12</p>
    </div>
  </div>
</div>

<!-- ============ STICKY SIGN UP BAR (phones, after the hero) ============ -->
<div class="cta-bar" [class.show]="showBar && !isNavMenuOpen">
  <button type="button" (click)="toggleMobileMenu()" class="btn btn-primary flex-1">Sign up</button>
  <button type="button" (click)="openLoginForm()" class="btn btn-outline flex-1">Log in</button>
</div>

<!-- ============ SIGN UP ============ -->
<div *ngIf="isMobileMenuOpen" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="signup-title">
  <div class="modal-backdrop" (click)="closeForm()"></div>
  <div class="sheet">
    <button type="button" class="sheet-close" (click)="closeForm()" aria-label="Close">&times;</button>
    <h3 id="signup-title">Create your account</h3>
    <p class="text-sm text-slate-500 mt-1 mb-4">Step 1 of 5. Add the learner's and parent's details.</p>

    <form (ngSubmit)="submitForm()" class="flex flex-col gap-3">
      <div>
        <label class="field-label" for="f-first">Learner name(s)</label>
        <input id="f-first" name="learnerFirstName" [(ngModel)]="learnerFirstName" required type="text"
          autocomplete="given-name" class="field">
      </div>
      <div>
        <label class="field-label" for="f-last">Learner surname</label>
        <input id="f-last" name="learnerSurname" [(ngModel)]="learnerSurname" required type="text"
          autocomplete="family-name" class="field">
      </div>
      <div>
        <label class="field-label" for="f-grade">Grade</label>
        <select id="f-grade" name="grade" [(ngModel)]="grade" required class="field">
          <option value="" disabled>Choose a grade</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>
      <div>
        <label class="field-label" for="f-email">Learner email</label>
        <input id="f-email" name="email" [(ngModel)]="email" required type="email" inputmode="email"
          autocomplete="email" class="field">
      </div>
      <div>
        <label class="field-label" for="f-school">School name</label>
        <input id="f-school" name="schoolName" [(ngModel)]="schoolName" required type="text" class="field">
      </div>
      <div>
        <label class="field-label" for="f-parent">Parent/guardian full names</label>
        <input id="f-parent" name="parentFullName" [(ngModel)]="parentFullName" required type="text"
          autocomplete="name" class="field">
      </div>
      <div>
        <label class="field-label" for="f-cell">Parent/guardian cell number</label>
        <input id="f-cell" name="parentCell" [(ngModel)]="parentCell" required type="tel" inputmode="tel"
          autocomplete="tel" class="field">
      </div>

      <button type="submit" class="btn btn-navy w-full mt-2"
        [disabled]="isSubmitting || !learnerFirstName || !learnerSurname || !grade || !email || !schoolName || !parentFullName || !parentCell">
        {{ isSubmitting ? 'Signing you up…' : 'Sign up' }}
      </button>
      <p *ngIf="isSubmitting" class="text-center text-sm text-slate-500" aria-live="polite">
        Registering you and sending your email. Please keep this page open.
      </p>
    </form>

    <p class="text-center text-sm mt-4">
      Already have an account?
      <button type="button" class="font-bold underline" (click)="closeForm(); openLoginForm()">Log in</button>
    </p>
  </div>
</div>

<!-- ============ LOG IN ============ -->
<div *ngIf="isLoginFormOpen" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <div class="modal-backdrop" (click)="closeLoginForm()"></div>
  <div class="sheet">
    <button type="button" class="sheet-close" (click)="closeLoginForm()" aria-label="Close">&times;</button>
    <h3 id="login-title" class="mb-4">Log in</h3>

    <form (ngSubmit)="submitLogin()" class="flex flex-col gap-3">
      <div>
        <label class="field-label" for="l-email">Email</label>
        <input id="l-email" name="loginEmail" [(ngModel)]="loginEmail" required type="email" inputmode="email"
          autocomplete="username" class="field">
      </div>
      <div>
        <label class="field-label" for="l-pass">Password</label>
        <input id="l-pass" name="loginPassword" [(ngModel)]="loginPassword" required type="password"
          autocomplete="current-password" class="field">
      </div>
      <button type="submit" [disabled]="!loginEmail || !loginPassword" class="btn btn-navy w-full mt-2">Log in</button>
    </form>

    <p class="text-center text-sm mt-4">
      New here?
      <button type="button" class="font-bold underline" (click)="closeLoginForm(); toggleMobileMenu()">Sign up</button>
    </p>
  </div>
</div>

<!-- ============ CONTACT ============ -->
<div *ngIf="isContactFormOpen" class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="contact-title">
  <div class="modal-backdrop" (click)="closeContactForm()"></div>
  <div class="sheet">
    <button type="button" class="sheet-close" (click)="closeContactForm()" aria-label="Close">&times;</button>
    <h3 id="contact-title" class="mb-4">Contact us</h3>

    <div class="flex gap-2 mb-4">
      <button type="button" (click)="contactFormType = 'whatsapp'" class="btn flex-1 !min-h-10 text-sm"
        [ngClass]="contactFormType === 'whatsapp' ? 'bg-[#1e3a8a] text-white' : 'bg-slate-100 text-slate-700'">WhatsApp</button>
      <button type="button" (click)="contactFormType = 'email'" class="btn flex-1 !min-h-10 text-sm"
        [ngClass]="contactFormType === 'email' ? 'bg-[#1e3a8a] text-white' : 'bg-slate-100 text-slate-700'">Email</button>
    </div>

    <form *ngIf="contactFormType === 'whatsapp'" (ngSubmit)="sendWhatsappMessage()" class="flex flex-col gap-3">
      <div>
        <label class="field-label" for="c-wa">Your WhatsApp number</label>
        <input id="c-wa" name="whatsappNumber" [(ngModel)]="whatsappNumber" required type="tel" inputmode="tel"
          autocomplete="tel" class="field">
      </div>
      <div>
        <label class="field-label" for="c-wa-msg">Message</label>
        <textarea id="c-wa-msg" name="whatsappMessage" [(ngModel)]="whatsappMessage" required rows="4" class="field"></textarea>
      </div>
      <button type="submit" [disabled]="!whatsappNumber || !whatsappMessage" class="btn btn-primary w-full">Send on WhatsApp</button>
    </form>

    <form *ngIf="contactFormType === 'email'" (ngSubmit)="sendEmailMessage()" class="flex flex-col gap-3">
      <div>
        <label class="field-label" for="c-em-msg">Message</label>
        <textarea id="c-em-msg" name="emailMessage" [(ngModel)]="emailMessage" required rows="5" class="field"></textarea>
      </div>
      <button type="submit" [disabled]="!emailMessage" class="btn btn-primary w-full">Send email</button>
    </form>
  </div>
</div>
