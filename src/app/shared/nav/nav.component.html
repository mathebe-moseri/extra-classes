<header class="w-full !bg-white py-3 fixed top-0 left-0 right-0 z-[99999] shadow-md px-4 md:px-6 lg:px-8 h-14"
  style="background-color: #ffffff !important; opacity: 1 !important; ">
  <div class="flex items-center justify-between">

    <!-- Brand -->
    <a (click)="scrollToHero()"
      class="font-semibold text-gray-900 text-[12px] md:text-[14px] lg:text-[16px] cursor-pointer">
      <span class="block italic font-serif font-medium text-[6px] md:text-[10px] lg:text-[12px] px-9">
        Sesi Mathebe
      </span>
      <span>Remote Extra Classes</span>
    </a>

    <!-- DESKTOP BUTTONS -->
    <div class="hidden md:flex items-center gap-3">

      <!-- Info -->
      <button (click)="scrollToAbout()"
        class="bg-white-50 hover:bg-blue-600 text-gray-600 px-4 rounded-full font-bold transition">
        info !!
      </button>

      <!-- Join -->
      <button (click)="toggleMobileMenu()"
        class="w-28 bg-gray-600 border border-gray-700 rounded-full py-2 text-white font-bold shadow-lg">
      </button>

    </div>

    <!-- MOBILE MENU BUTTON -->
    <button (click)="toggleNavMenu()" aria-label="Menu"
      class="md:hidden text-2xl font-bold text-gray-800 w-8 text-center">
      {{ isNavMenuOpen ? '✕' : '☰' }}
    </button>

  </div>
</header>

<!-- MOBILE MENU -->
<!-- MOBILE MENU -->
<div *ngIf="isNavMenuOpen" class="md:hidden fixed top-14 left-0 right-0 bottom-0 z-[99990] bg-[#1e3a8a] overflow-y-auto">
  <div class="flex flex-col min-h-full px-5 pt-3 pb-6">

    <nav class="text-white font-bold">

      <button type="button" (click)="goTo('about-us')"
        class="w-full flex items-center justify-between py-4 border-b border-white/15 text-left">
        <span>What We Offer</span><span class="text-blue-200">›</span>
      </button>

      <button type="button" (click)="openTestimonialsFromMenu()"
        class="w-full flex items-center justify-between py-4 border-b border-white/15 text-left">
        <span>Testimonials</span><span class="text-blue-200">▶</span>
      </button>

      <button type="button" (click)="goTo('demo-lesson')"
        class="w-full flex items-center justify-between py-4 border-b border-white/15 text-left">
        <span>Free Demo Lesson</span><span class="text-blue-200">›</span>
      </button>

      <button type="button" (click)="goTo('how-to-apply')"
        class="w-full flex items-center justify-between py-4 border-b border-white/15 text-left">
        <span>How To Apply</span><span class="text-blue-200">›</span>
      </button>

      <button type="button" (click)="goTo('payment')"
        class="w-full flex items-center justify-between py-4 border-b border-white/15 text-left">
        <span>Payment Details</span><span class="text-blue-200">›</span>
      </button>

      <button type="button" (click)="goTo('special-classes')"
        class="w-full flex items-center justify-between py-4 border-b border-white/15 text-left">
        <span>Special Request Classes</span><span class="text-blue-200">›</span>
      </button>

      <!-- Contact us (expands) -->
      <button type="button" (click)="isContactMenuOpen = !isContactMenuOpen"
        class="w-full flex items-center justify-between py-4 text-left">
        <span>Contact us</span>
        <span class="text-blue-200 text-sm transition-transform duration-200"
          [class.rotate-180]="isContactMenuOpen">⌄</span>
      </button>

      <div *ngIf="isContactMenuOpen" class="flex gap-3 pb-4">
        <button type="button" (click)="openContactFrom('whatsapp')"
          class="flex-1 py-3 rounded-xl bg-white/15 text-white font-bold">
          💬 WhatsApp
        </button>
        <button type="button" (click)="openContactFrom('email')"
          class="flex-1 py-3 rounded-xl bg-white/15 text-white font-bold">
          ✉️ Email
        </button>
      </div>

    </nav>

    <!-- Bottom actions -->
    <div class="mt-auto pt-6 border-t border-white/15">
      <button type="button" (click)="closeNavMenu(); toggleMobileMenu()"
        class="w-full py-3 rounded-xl bg-emerald-400 text-slate-900 font-bold transition-all duration-300">
        Sign up
      </button>
      <button type="button" (click)="closeNavMenu(); openLoginForm()"
        class="mt-3 w-full py-3 rounded-xl border-2 border-white text-white font-bold hover:bg-white hover:text-[#1e3a8a] transition-all duration-300">
        Log in
      </button>
      <p class="text-blue-100 text-xs text-center mt-4">
        CAPS-aligned · Grades 10, 11 and 12
      </p>
    </div>

  </div>
</div>

<!-- Join Form Popup -->
<div *ngIf="isMobileMenuOpen" class="fixed inset-0 flex items-center justify-center popup px-3 md:px-6 lg:px-8">
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="closeForm()"></div>

  <div class="form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm md:max-w-md lg:max-w-lg 
              p-4 md:p-6 lg:p-8 relative" (click)="$event.stopPropagation()">
    <button (click)="closeForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
    <h3 class="text-center font-bold text-lg mb-4">Sign Up</h3>

    <form (ngSubmit)="submitForm()" class="flex flex-col gap-3">
      <input name="learnerFirstName" [(ngModel)]="learnerFirstName" required type="text" placeholder="Learner Name(s)"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="learnerSurname" [(ngModel)]="learnerSurname" required type="text" placeholder="Learner Surname"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="grade" [(ngModel)]="grade" required type="text" placeholder="Learner Grade"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="email" [(ngModel)]="email" required type="email" placeholder="Learner Email"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="schoolName" [(ngModel)]="schoolName" required type="text" placeholder="Learner School-Name"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="parentFullName" [(ngModel)]="parentFullName" required type="text"
        placeholder="Parent/Guardian Full Names"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="parentCell" [(ngModel)]="parentCell" required type="text" placeholder="Parent/Guardian Cell"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <button type="submit"
        [disabled]="isSubmitting || !learnerFirstName || !learnerSurname || !grade || !email || !schoolName || !parentFullName || !parentCell"
        class="mt-2 w-full bg-gray-800 hover:bg-gray-700 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white-50 disabled:opacity-60 disabled:cursor-not-allowed">
        {{ isSubmitting ? 'Please wait...' : 'Sign Up' }}
      </button>
      <p *ngIf="isSubmitting" class="text-center text-sm text-gray-600">
        Registering you and sending your email. Please don't close this page.
      </p>
    </form>

    <p class="text-center text-sm mt-4">
      Already have an account?
      <button type="button" class="font-bold underline" (click)="closeForm(); openLoginForm()">Log in</button>
    </p>
  </div>
</div>

<!-- Login Form Popup -->
<div *ngIf="isLoginFormOpen" class="fixed inset-0 flex items-center justify-center popup px-3 md:px-6 lg:px-8">
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="closeLoginForm()"></div>

  <div class="form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm md:max-w-md lg:max-w-lg
              p-4 md:p-6 lg:p-8 relative" (click)="$event.stopPropagation()">
    <button (click)="closeLoginForm()"
      class="absolute top-2 right-3 text-gray-800 font-bold text-2xl leading-none px-2">&times;</button>

    <h3 class="text-center font-bold text-lg mt-6 mb-4">Log In</h3>

    <form (ngSubmit)="submitLogin()" class="flex flex-col gap-3">
      <input name="loginEmail" [(ngModel)]="loginEmail" required type="email" placeholder="Email"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <input name="loginPassword" [(ngModel)]="loginPassword" required type="password" placeholder="Password"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <button type="submit" [disabled]="!loginEmail || !loginPassword"
        class="mt-2 w-full bg-gray-800 hover:bg-gray-700 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white-50">
        Log In
      </button>
    </form>

    <p class="text-center text-sm mt-4">
      New here?
      <button type="button" class="font-bold underline" (click)="closeLoginForm(); toggleMobileMenu()">Sign up</button>
    </p>
  </div>
</div>


<!-- Contact Form Popup -->
<div *ngIf="isContactFormOpen" class="fixed inset-0 flex items-center justify-center popup px-3 md:px-6 lg:px-8">
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm" (click)="closeContactForm()"></div>

  <div class="contact-form-popup form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-sm md:max-w-md lg:max-w-lg 
              p-4 md:p-6 lg:p-8 relative" (click)="$event.stopPropagation()">
    <button (click)="closeContactForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
    <h3 class="text-center font-bold text-lg mb-4">Contact Us</h3>

    <div class="flex justify-center gap-4 mb-4">
      <button (click)="contactFormType='whatsapp'"
        [ngClass]="contactFormType==='whatsapp' ? 'bg-green-500 text-white' : 'bg-gray-600 text-gray-800'"
        class="px-3 py-1 md:py-2 rounded font-bold">WhatsApp</button>
      <button (click)="contactFormType='email'"
        [ngClass]="contactFormType==='email' ? 'bg-green-500 text-white' : 'bg-gray-600 text-gray-800'"
        class="px-3 py-1 md:py-2 rounded font-bold">Email</button>
    </div>

    <!-- WhatsApp Form -->
    <form *ngIf="contactFormType==='whatsapp'" (ngSubmit)="sendWhatsappMessage()" class="flex flex-col gap-3">
      <input name="whatsappNumber" [(ngModel)]="whatsappNumber" required type="text" placeholder="Your WhatsApp Number"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50">
      <textarea name="whatsappMessage" [(ngModel)]="whatsappMessage" required placeholder="Your Message"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50"></textarea>
      <button type="submit" [disabled]="!whatsappNumber || !whatsappMessage"
        class="mt-2 w-full bg-green-500 hover:bg-green-600 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white">
        Send via WhatsApp
      </button>
    </form>

    <!-- Email Form -->
    <form *ngIf="contactFormType==='email'" (ngSubmit)="sendEmailMessage()" class="flex flex-col gap-3">
      <textarea name="emailMessage" [(ngModel)]="emailMessage" required placeholder="Your Message"
        class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 bg-white-50"></textarea>
      <button type="submit" [disabled]="!emailMessage"
        class="mt-2 w-full bg-green-500 hover:bg-blue-600 transition-colors rounded py-2 md:py-3 lg:py-4 font-bold text-white">
        Send via Email
      </button>
    </form>
  </div>
</div>
