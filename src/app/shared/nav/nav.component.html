<header class="w-full bg-gray-300 lg:px-8 py-2 flex items-center justify-between">
<a class="inline-block transition-all duration-300 font-semibold 
          text-gray-800 px-3 py-1 
          hover:scale-110 active:scale-95 text-[12px] lg:text-[16px]" 
   href="#hero">
    <span class="text-[8px] ml-[34px] block">Sesi Mathebe</span>
    <span class="block mt-[-2px]">Remote Extra Classes</span>
</a>

    <div class="relative md:hidden group">
        <div class="absolute -translate-x-20 translate-y-1 cursor-pointer" (click)="toggleBg()">
            <div class="w-14 h-8 bg-white-50 rounded-full flex items-center px-1 transition-all duration-300 text-gray-800 text-[10px] mt-[8px]">contactUS
                <!-- <div class="w-6 h-6 rounded-full transition-transform duration-300" [ngClass]="
                currentBg
                ? 'bg-black-100 translate-x-0'
                : 'bg-[#00213d] translate-x-[24px]'
            ">
                </div> -->
            </div>
        </div>
        <button (click)="toggleMobileMenu()"
            class="right-2  w-24 bg-gray-800 border border-gray-700 
            rounded-lg flex flex-col shadow-lg py-2 z-50 text-white-50 text-[12px] font-bold cursor-pointer select-none -translate-x-2 mobile-menu-toggle">
            Join<br>Our Classes
    </button>
        <div *ngIf="isMobileMenuOpen" class="absolute right-2 mt-4 w-40 bg-gray-800 border border-gray-700 
            rounded-lg flex flex-col shadow-lg py-2 z-50 text-white-50">
            <a href="/mathebe-cv.pdf" download="Mathebe_cv.pdf" (click)="closeMobileMenuWithDelay()"
                class="px-3 py-1 text-sm active:bg-gray-700 rounded">
                Grade 10
            </a>
            <a href="#projects" (click)="selectMenuItem('projects')"
                [ngClass]="selectedMenuItem === 'projects' ? 'bg-gray-700 text-white' : 'text-white'"
                class="px-3 py-2 text-sm rounded transition-colors duration-300 active:bg-gray-700">
                Grade 11
            </a>
            <a href="#experience" (click)="selectMenuItem('experience')"
                [ngClass]="selectedMenuItem === 'experience' ? 'bg-gray-700 text-white' : 'text-white'"
                class="px-3 py-2 text-sm rounded transition-colors duration-300 active:bg-gray-700">
                Grade 12
            </a>
        </div>

    </div>

    <div class="hidden md:flex items-center space-x-6 pr-4">
        <a href="/mathebe-cv.pdf" download="Mathebe_cv.pdf"
            class="text-white-50 border-2 border-[#1C2A4A] rounded p-1 hover:bg-blue-100 hover:scale-110 active:scale-95 inline-block transition-all duration-300">My
            Resume</a>
        <a href="#projects" class="relative text-gray-400 p-1
          transition-all duration-300
          before:content-[''] before:absolute before:left-0 before:bottom-0
          before:h-[2px] before:bg-white-50
          before:w-0 before:transition-all before:duration-300
          hover:before:w-full">Projects</a>
        <!-- <a href="#linkedin" class="text-gray-400 border-2 border-[#1C2A4A] rounded p-1">LinkedIn</a> -->
        <a href="#experience" class="relative text-gray-400 p-1
          transition-all duration-300
          before:content-[''] before:absolute before:left-0 before:bottom-0
          before:h-[2px] before:bg-white-50
          before:w-0 before:transition-all before:duration-300
          hover:before:w-full">Experience</a>
        <a href="#Contacts" class="relative text-gray-400 p-1
          transition-all duration-300
          before:content-[''] before:absolute before:left-0 before:bottom-0
          before:h-[2px] before:bg-white-50
          before:w-0 before:transition-all before:duration-300
          hover:before:w-full">Contacts</a>
        <div class="w-20 h-10 bg-white-50 rounded-full flex items-center px-1 transition-all duration-300 cursor-pointer"
            (click)="toggleBg()">
            <div class="w-8 h-8 rounded-full transition-transform duration-300" [ngClass]="
                currentBg
                ? 'bg-black-100 translate-x-0'
                : 'bg-[#00213d] translate-x-[39px]'
            ">
            </div>
        </div>
    </div>
</header>
