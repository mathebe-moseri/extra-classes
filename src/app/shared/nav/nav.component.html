
<header class="w-full bg-gray-300 lg:px-8 py-2 flex items-center justify-between fixed top-0 z-50 shadow-md">

  <!-- Navbar item -->
  <a class="inline-block transition-all duration-300 font-semibold text-gray-800 px-3 py-1 text-center text-[12px] lg:text-[16px]"
     href="#hero">
    <span class="block text-[8px]">Sesi Mathebe</span>
    <span class="block mt-[-2px]">Remote Extra Classes</span>
  </a>

  <!-- Mobile menu / contact toggle -->
  <div class="relative md:hidden group flex items-center justify-end px-3">

    <!-- contactUS toggle -->
    <div class="absolute right-32 top-1/2 -translate-y-1/2 cursor-pointer contact-toggle" (click)="openContactForm()">
      <div class="w-14 h-8 bg-white-50 rounded-full flex items-center justify-center px-1 transition-all duration-300 text-gray-800 text-[9px]">
        contactUS
      </div>
    </div>

    <!-- Join Our Classes button -->
    <button (click)="toggleMobileMenu()"
            class="mobile-menu-toggle w-24 bg-gray-800 border border-gray-700 rounded-full flex flex-col shadow-lg py-2 z-50 text-white-50 text-[12px] font-bold cursor-pointer select-none">
      Join<br>Our Classes
    </button>
  </div>


  <div *ngIf="isContactFormOpen" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50 px-3">
    <div class="contact-form-popup form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-md p-6 relative">

      <button (click)="closeContactForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>

      <h3 class="text-center font-bold text-lg mb-4">Contact Us</h3>

      <!-- Choose form type -->
      <div class="flex justify-center gap-4 mb-4">
        <button (click)="contactFormType='whatsapp'"
                [ngClass]="contactFormType==='whatsapp' ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-800'"
                class="px-3 py-1 rounded font-bold">
          WhatsApp
        </button>
        <button (click)="contactFormType='email'"
                [ngClass]="contactFormType==='email' ? 'bg-green-500 text-white' : 'bg-gray-300 text-gray-800'"
                class="px-3 py-1 rounded font-bold">
          Email
        </button>
      </div>

      <!-- WhatsApp Form -->
      <form *ngIf="contactFormType==='whatsapp'" (ngSubmit)="sendWhatsappMessage()" class="flex flex-col gap-3">
        <input name="whatsappNumber" [(ngModel)]="whatsappNumber" required type="text" placeholder="Your WhatsApp Number"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <textarea name="whatsappMessage" [(ngModel)]="whatsappMessage" required placeholder="Your Message"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]"></textarea>
        <button type="submit" [disabled]="!whatsappNumber || !whatsappMessage"
                class="mt-2 w-full bg-green-500 hover:bg-green-600 transition-colors rounded py-2 font-bold text-white">
          Send via WhatsApp
        </button>
      </form>

      <!-- Email Form -->
      <form *ngIf="contactFormType==='email'" (ngSubmit)="sendEmailMessage()" class="flex flex-col gap-3">
        <input name="emailAddress" [(ngModel)]="emailAddress" required type="email" placeholder="Your Email"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <textarea name="emailMessage" [(ngModel)]="emailMessage" required placeholder="Your Message"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]"></textarea>
        <button type="submit" [disabled]="!emailAddress || !emailMessage"
                class="mt-2 w-full bg-green-500 hover:bg-blue-600 transition-colors rounded py-2 font-bold text-white">
          Send via Email
        </button>
      </form>
    </div>
  </div>

  <!-- Join Form Popup -->
  <div *ngIf="isMobileMenuOpen" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50 px-3">
    <div class="form-popup bg-white-50 text-gray-800 rounded-lg shadow-lg w-full max-w-md p-6 relative">
      <button (click)="closeForm()" class="absolute top-2 right-2 text-gray-800 font-bold text-lg">&times;</button>
      <h3 class="text-center font-bold text-lg mb-4">Join Our Classes</h3>

      <form (ngSubmit)="submitForm()" class="flex flex-col gap-3">
        <input name="learnerFirstName" [(ngModel)]="learnerFirstName" required type="text" placeholder="Learner First Name"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <input name="learnerSurname" [(ngModel)]="learnerSurname" required type="text" placeholder="Learner Surname"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <input name="grade" [(ngModel)]="grade" required type="text" placeholder="Grade"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <input name="email" [(ngModel)]="email" required type="email" placeholder="Email"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <input name="schoolName" [(ngModel)]="schoolName" required type="text" placeholder="School Name"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <input name="parentFullName" [(ngModel)]="parentFullName" required type="text" placeholder="Parent/Guardian Full Name"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <input name="parentCell" [(ngModel)]="parentCell" required type="text" placeholder="Parent/Guardian Cell"
               class="px-3 py-2 rounded-md border border-gray-300 text-gray-800 focus:outline-none focus:border-gray-400 bg-white-50 text-[14px]">
        <button type="submit"
                [disabled]="!learnerFirstName || !learnerSurname || !grade || !email || !schoolName || !parentFullName || !parentCell"
                class="mt-2 w-full bg-gray-800 hover:bg-gray-700 transition-colors rounded py-2 font-bold text-white-50">
          JOIN
        </button>
      </form>
    </div>
  </div>
