<!-- Testimonials Section -->
<div class="rounded-xl p-10">
  <div class="w-full flex flex-col items-center justify-center bg-gray-900 px-4 py-12 rounded-xl">
    <h2 class="text-white text-3xl md:text-4xl font-bold mb-8 text-center">Testimonials</h2>

    <div class="w-full max-w-5xl px-4">
      <div class="bg-gray-800 rounded-xl overflow-hidden shadow-xl border border-gray-700">
        <!-- Responsive YouTube Video -->
        <div class="video-container">
          <iframe width="560" height="315"
            src="https://www.youtube.com/embed/j85JYYSE1vI?si=Xugh7NKnaA_SbJae"
            title="Testimonials Video" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
          </iframe>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Demo Lesson Section -->
<div class="rounded-xl p-10">
  <div class="w-full flex flex-col items-center justify-center bg-gray-900 px-4 py-12 rounded-xl">
    <h2 class="text-white text-3xl md:text-4xl font-bold mb-8 text-center">Demo Lesson</h2>

    <div class="w-full max-w-5xl px-4">
      <div class="bg-gray-800 rounded-xl overflow-hidden shadow-xl border border-gray-700">
        <div class="aspect-video">
          <iframe class="w-full h-full" src="" title="Demo Lesson Video" frameborder="0"
            allow="autoplay; encrypted-media; fullscreen" allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>

    <p class="mt-6 text-center text-gray-300 text-lg max-w-2xl">
      After going through this demo lesson, you can try to solve the following questions.
    </p>

    <button (click)="openQuiz()"
      class="mt-4 px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-lg hover:bg-blue-700 transition-all duration-300">
      Test Your Knowledge
    </button>
  </div>
</div>

<!-- Quiz Modal -->
<div *ngIf="showQuiz" class="fixed inset-0 flex items-center justify-center z-50">
  <!-- Background blur -->
  <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm"></div>

  <!-- Modal content -->
  <div class="relative bg-gray-900 text-white rounded-xl p-8 w-11/12 max-w-md shadow-2xl z-10">
    <h3 class="text-2xl font-bold mb-4 text-center">Trig Quiz</h3>

    <p class="mb-4 text-center">
      In a right-angled triangle, if angle θ is {{quizAngle}}° and the hypotenuse is {{quizHypotenuse}} units, what is
      the length of the side opposite to θ?
    </p>

    <input [(ngModel)]="userAnswer" type="number" placeholder="Enter your answer"
      class="w-full border border-gray-600 rounded px-3 py-2 mb-4 text-gray-900">

    <div class="flex justify-between">
      <button (click)="checkAnswer()"
        class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition-all duration-200">
        Submit
      </button>
      <button (click)="closeQuiz()"
        class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-all duration-200">
        Close
      </button>
    </div>

    <p *ngIf="feedback" class="mt-4 font-semibold text-center"
      [ngClass]="{'text-green-500': isCorrect, 'text-red-500': !isCorrect}">
      {{feedback}}
    </p>
  </div>
</div>
